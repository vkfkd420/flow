spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# MySQL - 접속 정보는 환경 변수 또는 backend/.env 파일로 주입 (.env.example 참고)
# 예) DB_URL=jdbc:mysql://localhost:3306/flow
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# MyBatis
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# 파일 업로드: 요청당 1개, 최대 10MB (요청 크기는 multipart 헤더 여유분 포함)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# AWS S3 (자격 증명은 SDK 기본 체인: 로컬 ~/.aws/credentials, 배포 환경 IAM 역할)
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${AWS_S3_BUCKET:}
